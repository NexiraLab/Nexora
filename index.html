<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora — Skill Passport</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      text-align: center;
    }

    .hero {
      padding: 80px 20px;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 15px;
    }

    .tagline {
      font-size: 20px;
      color: #4b5563;
      margin-bottom: 30px;
    }

    button {
      padding: 15px 28px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .features {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 15px 0;
      border-radius: 16px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>Nexora</h1>

    <p class="tagline">
      Proof what you learn. Own what you achieve.
    </p>

    <button>Explore Skill Passport</button>
  </section>

  <section class="features">

    <div class="card">
      <h2>🎓 Verifiable Skills</h2>
      <p>Turn real learning into trusted digital proof.</p>
    </div>

    <div class="card">
      <h2>🚀 Project-Based Proof</h2>
      <p>Show what you can actually build, not just what you claim.</p>
    </div>

    <div class="card">
      <h2>🔐 Your Achievement</h2>
      <p>Build a portable record of your skills and achievements.</p>
    </div>

  </section>

</body>
</html>
